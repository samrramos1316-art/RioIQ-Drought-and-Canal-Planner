<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="Drought seasons missed and false alarms, model against baseline">
<title>Drought seasons missed and false alarms, model against baseline</title>
<rect width="900" height="410" fill="#ffffff"/>
<text x="24.0" y="32.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#14202b">What the lower cost is paid for with (693 western counties)</text>
<text x="24.0" y="54.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#4a5a66">The model warns more often, so it misses fewer drought seasons and raises more false alarms.</text>
<text x="24.0" y="72.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#4a5a66">A miss counts as 3 false alarms, so the trade lowers the model's total cost: 23,583 against 24,955.</text>
<rect x="162.5" y="257.3" width="110" height="62.7" fill="#1f7a3d"/>
<text x="217.5" y="249.3" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#14202b">3,938</text>
<text x="217.5" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#14202b">Model</text>
<rect x="292.5" y="236.0" width="110" height="84.0" fill="#9aa4a8"/>
<text x="347.5" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#14202b">5,270</text>
<text x="347.5" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#14202b">Baseline</text>
<text x="282.5" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a5a66">Drought seasons missed (a missed drought season costs 3)</text>
<rect x="547.5" y="132.5" width="110" height="187.5" fill="#1f7a3d"/>
<text x="602.5" y="124.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#14202b">11,769</text>
<text x="602.5" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#14202b">Model</text>
<rect x="677.5" y="174.3" width="110" height="145.7" fill="#9aa4a8"/>
<text x="732.5" y="166.3" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#14202b">9,145</text>
<text x="732.5" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#14202b">Baseline</text>
<text x="667.5" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a5a66">False alarms (a false alarm costs 1)</text>
<line x1="80" y1="320" x2="870" y2="320" stroke="#14202b" stroke-width="1.4"/>
<text x="24.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5a66">Share of forecasts right: model 89.5%, baseline 90.3%. The model wins on cost, not on share right.</text>
</svg>
