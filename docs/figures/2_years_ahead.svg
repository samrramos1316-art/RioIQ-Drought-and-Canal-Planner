<text x="24.0" y="54.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#4a5a66">Each bar is one year of forecasts. Green (below zero): the model cost less. The model was ahead in 13 of 18 years.</text>
<text x="24.0" y="72.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#4a5a66">Baseline: the rule "severe drought now". Cost = 3 x missed drought seasons + false alarms.</text>
