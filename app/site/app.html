<!doctype html>
<!--
  app.html: the platform. One screen: a large map on the left, and on the right three steps
  that follow the order of a real decision:

      1 Risk profile   what is the drought risk here, and which canals leak
      2 Budget plan    given a budget and a drought severity, exactly which canals to seal,
                       what it costs, how long it takes and how much water it keeps
      3 Simulation     one district or several, doing nothing against acting on the forecast

  The map is drawn by js/scanmap.js on a <canvas>. It opens with a "scan" that builds the
  picture one layer at a time. On the Simulation step the state view picks districts by
  tapping them on the map (or ticking them in the list), and then js/twin.js draws them
  twice, side by side.

  Every visit starts by asking who you are: the state (all of Texas) or one district.
  There is no sign-in. All logic is in js/platform.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="logo/rioiq-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo/rioiq-icon-180.png">
  <title>RioIQ Platform: Rio Grande Drought and Canal Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="app">
  <div class="strip">A student hackathon project (Veritas AI, AI + Climate track). Not a government website. No sign-in. No personal data is collected.</div>

  <header class="topbar" id="topbar">
    <a class="brand" href="index.html" title="Back to the intro">
      <img src="logo/rioiq-logo-animated.svg" alt="RioIQ" width="376" height="150" style="height:30px;width:auto;display:block">
    </a>
    <button class="scopeBtn" id="scopeBtn" title="Change district or switch to the state view"></button>
    <span class="spacer"></span>
    <span class="live saved" id="live"><i></i><span id="liveText"></span></span>
    <button class="topBtn" id="themeBtn" title="Switch between dark and light">Light mode</button>
    <a class="plain" href="index.html">Intro</a>
  </header>

  <main class="shell" id="shell">
    <section class="stage" id="stage">
      <!-- The two canvases are pictures: a screen reader is told what each one is. Everything on
           the map can also be reached from the lists and tables in the panel on the right. -->
      <canvas id="map" role="img" aria-label="Map of Texas: drought by county, the Rio Grande, irrigation districts and canals. The same districts and canals are listed in the panel."></canvas>
      <canvas id="twin" role="img" aria-label="Simulation picture: the chosen districts shown twice, doing nothing and sealing canals when the forecast warns. The figures are in the panel."></canvas>
      <div id="vig" class="mapOnly"></div><div class="cine t"></div><div class="cine b"></div>
      <div id="bar"></div>
      <!-- Map controls -->
      <div id="views" class="mapOnly">
        <button class="sbtn" data-view="scope" id="viewScope">My view</button>
        <button class="sbtn" data-view="texas">Texas</button>
        <button class="sbtn" data-view="corridor">River corridor</button>
        <button class="sbtn" data-view="elpaso">El Paso</button>
        <button class="sbtn" data-view="maverick">Eagle Pass</button>
        <button class="sbtn" data-view="valley">Lower Valley</button>
      </div>
      <div id="actions" class="mapOnly"><button class="sbtn main" id="replay">Replay scan</button><button class="sbtn" id="skip">Skip animation</button></div>
      <div id="hud" class="mapOnly"><div class="phase" id="phase"></div><div id="hud1"></div><div id="hud2"></div></div>
      <div id="legend" class="mapOnly"></div>
      <div id="zoom" class="mapOnly"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
      <div id="coords" class="mapOnly"></div>
      <div id="tip"></div>
      <!-- Simulation. While districts are being chosen: a one-line prompt and a Run button on the map.
           While the result plays: a back button, four scenario buttons and the play bar. -->
      <div id="simSteps"></div>
      <div id="simPrompt" aria-hidden="true"></div>
      <button class="sbtn main" id="simGo" tabindex="0" hidden></button>
      <div id="simCases" class="simOnly"></div>
      <div id="simBar" class="simOnly"><button class="sbtn main" id="simPlay">Play</button><button class="sbtn" id="simSkip" title="Skip to the end">End</button><input type="range" id="simSeek" min="0" max="1" value="0" aria-label="Week"><span id="simDate"></span></div>
    </section>
    <aside class="panel">
      <nav class="stepper" id="stepper" aria-label="Steps">
        <button data-step="risk"><b>1</b>Risk profile</button>
        <button data-step="budget"><b>2</b>Budget plan</button>
        <button data-step="sim"><b>3</b>Simulation</button>
        <button data-step="sources"><b>4</b>Sources</button>
      </nav>
      <!-- tabindex -1: the panel can be given the keyboard focus by the page after it is redrawn -->
      <div class="view" id="view" tabindex="-1"></div>
    </aside>
  </main>

  <!-- For researchers: every figure behind the page as files (js/platform.js, exportData).
       Kept small and quiet on purpose; the menu opens only when asked. -->
  <footer class="foot" id="foot">
    <span>For researchers:</span>
    <button class="footLink" id="exportBtn" aria-expanded="false" aria-controls="exportMenu">export the data</button>
    <span class="exportMenu" id="exportMenu" hidden>
      <button class="footLink" data-export="drought" title="Every county: drought now, and the 6-month and 3-month chance of a drought season">Drought likelihood (CSV)</button>
      <button class="footLink" data-export="districts" title="Every irrigation district: counties, chances, risk and canal km">Districts (CSV)</button>
      <button class="footLink" data-export="canals" title="Every mapped canal segment: soil, seepage rate, rank, cost and its line">Canals (CSV)</button>
      <button class="footLink" data-export="plan" title="The budget plan with your current scope, budget, drought setting and canal width">Budget plan (CSV)</button>
      <button class="footLink" data-export="all" title="All of the above in one file, with the data's date, sources, assumptions and limits">Everything (JSON)</button>
    </span>
    <span class="exportNote" id="exportNote" aria-live="polite"></span>
  </footer>

  <!-- The chooser, shown on every visit: the state view, or one district from the list.
       tabindex -1: the page moves the keyboard focus here when it opens, so Tab starts inside it.
       tabindex 0 on its buttons: Safari only puts a button in the Tab order if it asks. -->
  <div class="onboard" id="onboard" role="dialog" aria-modal="true" aria-labelledby="onboardTitle" tabindex="-1">
    <div class="sheet">
      <p class="kicker">RioIQ platform</p>
      <h1 id="onboardTitle">Who is this for?</h1>
      <div class="roles">
        <button class="role" id="roleState" tabindex="0"><b>State of Texas</b><span>Every district, compared.</span><i aria-hidden="true">&rarr;</i></button>
        <button class="role" id="roleDistrict" tabindex="0"><b>One irrigation district</b><span>Find yours in the list.</span><i aria-hidden="true">&darr;</i></button>
      </div>
      <div class="pick" id="pick">
        <label for="pickSearch">Irrigation districts</label>
        <input id="pickSearch" type="search" placeholder="Search district or county">
        <div class="pickList" id="pickList"></div>
      </div>
    </div>
  </div>

  <div id="lightbox" role="dialog" aria-label="Enlarged photo. Press Escape or click to close."><div><img alt=""><p></p></div></div>

  <script src="data/core.js"></script>
  <script src="data/sim.js"></script>
  <script src="sim/engine.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/common.js"></script>
  <script src="js/scanmap.js"></script>
  <script src="js/twin.js"></script>
  <script src="js/platform.js"></script>
</body>
</html>
