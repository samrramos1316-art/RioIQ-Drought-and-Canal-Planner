# Checks on every push and pull request: the two Python test folders, the simulation and site
# logic tests, a banned-word gate, a frozen gate and a size gate (ARCHITECTURE.md section 5.3).
#
# The "reproduce" job retrains version 1 on GitHub's computer and compares its three headline
# numbers with the frozen ones. Random forests are not identical across computers (see
# "machine_note" in reports/frozen/v1/metrics.json), so each must be within 1%, not equal.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-pipeline.txt
            requirements-app.txt
      - run: pip install -r requirements-pipeline.txt -r requirements-app.txt
      # The two folders are run separately: both hold a file named test_contract.py,
      # so `pytest tests` fails to collect them together.
      - name: App tests
        run: python -m pytest tests/app -q
      - name: Pipeline tests
        run: PYTHONPATH=src python -m pytest tests/pipeline -q
      - name: Simulation tests
        run: node app/site/sim/engine.test.js
      - name: Site logic tests
        run: node app/site/js/logic.test.js

  banned-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No "Headgate" or "streamlit" in app/, src/ or tests/
        run: |
          # -I skips binary files; app/site/data/ is generated data and is not searched.
          if grep -rIniE "headgate|streamlit" app src tests --exclude-dir=__pycache__ | grep -v "^app/site/data/"; then
            echo "Banned word found (see the lines above)."
            exit 1
          fi

  frozen-gate:
    # Scored results and the inputs they were scored on must not change. Needs no libraries.
    #
    # Two different checks, and only the last is a real barrier:
    #   - "match" steps compare the files with the hash lists IN THIS SAME COMMIT. Anyone who
    #     edits a scored file and its hash line together, or deletes a list and builds it again,
    #     passes them. They guard against accidents only (and are what the local command does).
    #   - the "base branch" step compares each hash list with the list on the base branch: a
    #     line that was there must still be there, unchanged. New lines are allowed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the base-branch step needs history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Raw inputs match data/manifest.json
        run: PYTHONPATH=src python -m farmdrought.manifest
      - name: Frozen results match reports/frozen.sha256
        run: PYTHONPATH=src python -m farmdrought.manifest frozen
      - name: Logged forecasts match reports/prospective.sha256
        run: PYTHONPATH=src python -m farmdrought.manifest prospective
      - name: Round 4 and 5 inputs match data/round4.sha256
        run: PYTHONPATH=src python -m farmdrought.manifest round4
      - name: Logged model M forecasts match reports/prospective_m.sha256
        run: PYTHONPATH=src python -m farmdrought.manifest prospective_m
      - name: No recorded hash changed or disappeared since the base branch
        run: |
          # Pull request: the branch it will merge into. Push to main: the commit main was at before.
          # Push to another branch: where it left main, if origin/main exists.
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            BASE="${{ github.event.before }}"
          elif git rev-parse -q --verify origin/main > /dev/null; then
            BASE="$(git merge-base HEAD origin/main)"
          fi
          echo "base: ${BASE:-none}"
          python tools/hash_list_gate.py "$BASE" reports/frozen.sha256 reports/prospective.sha256 reports/prospective_m.sha256 data/round4.sha256

  size-gate:
    # Prints the website's file sizes and fails if one grew past its limit (tools/site_size.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Website files are within their size limits
        run: python tools/site_size.py

  reproduce:
    # Retrain version 1 here and compare with reports/frozen/v1/metrics.json (tools/reproduce.py).
    # It writes nothing. Version 2 and the seed checks take hours and are not rerun.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Version 1 retrained here is within 1% of the frozen numbers
        run: PYTHONPATH=src python tools/reproduce.py
