# Live data: fetch the newest data every day, rebuild this week's forecast and the site data,
# and save the result.
#
# What changes how often:
#   reservoir storage     daily   -> a new reservoir reading every day
#   U.S. Drought Monitor  weekly  -> a new forecast, canal levels and sealant plan (Thursdays)
#   El Nino, weather      monthly
# The steps are in src/farmdrought/refresh.py. If a source is down, its saved file is kept.
#
# What this job never does: score. The test results were scored once and are kept in
# reports/frozen/. The downloads go to data/live; data/raw and notebooks/oni.txt are the
# snapshot those results were scored on and are never written here (the tests check that).
# If the tests fail, nothing is saved, so a bad download can never reach the repo.
name: Refresh live data

on:
  schedule:
    - cron: "0 15 * * *"   # every day at 15:00 UTC (9 AM in Texas), after the daily reservoir update
  workflow_dispatch:        # also adds a "Run workflow" button on the Actions tab

permissions:
  contents: write           # the job saves the refreshed files back to the repo

concurrency:
  group: refresh-live-data  # two runs must never push at the same time
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30    # downloads, one forecast and the site build; no model is re-scored
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-pipeline.txt
            requirements-app.txt
      - run: pip install -r requirements-pipeline.txt -r requirements-app.txt
      - name: Fetch new data and rebuild this week's forecast
        run: PYTHONPATH=src python -m farmdrought.refresh
      - name: Rebuild the website's data files
        run: python app/build_site.py
      - name: Check the outputs before saving them
        run: PYTHONPATH=src python -m pytest tests/pipeline -q
      - name: Save the refreshed files
        run: |
          # GitHub's own bot identity, so automated data commits are plainly automated.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/live ]; then git add data/live; fi
          if [ -d reports/live ]; then git add reports/live; fi
          if [ -d reports/prospective ]; then git add reports/prospective reports/prospective.sha256; fi
          if [ -d reports/prospective_m ]; then git add reports/prospective_m reports/prospective_m.sha256; fi
          git add data/processed/latest.parquet data/processed/canals.geojson data/processed/districts.geojson
          git add reports/metrics.json reports/refresh.json reports/issues.json app/site/data
          # commit only if a data file changed (refresh.json and issues.json change on every run)
          if git diff --cached --quiet -- data; then
            echo "No new data today."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
